<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación en Bicicleta</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #ffffff; /* Fondo blanco */
        }

        #pantalla-inicio {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff; /* Fondo blanco */
            z-index: 10;
            position: absolute;
            width: 100%;
        }

        #btn-iniciar {
            padding: 15px 50px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #000000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        #btn-iniciar:active {
            transform: scale(0.95);
        }

        #pantalla-animacion {
            display: none;
            height: 100vh;
            position: relative;
        }

        .calle {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background-color: #e0e0e0;
            border-top: 5px solid #000;
        }

        .lineas-calle {
            position: absolute;
            top: 50%;
            width: 200%;
            height: 10px;
            background: repeating-linear-gradient(90deg, transparent 0, transparent 50px, #000 50px, #000 100px);
            animation: moverCalle 0.6s linear infinite;
        }

        @keyframes moverCalle {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100px); }
        }

        .contenedor-stickman {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            animation: rebotar 0.3s alternate infinite;
        }

        @keyframes rebotar {
            0% { bottom: 110px; }
            100% { bottom: 115px; }
        }

        .rueda {
            transform-origin: center;
            animation: girarRueda 0.6s linear infinite;
        }

        @keyframes girarRueda {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Pantalla 1: Botón de Inicio -->
    <div id="pantalla-inicio">
        <button id="btn-iniciar">GO</button>
    </div>

    <!-- Pantalla 2: Animación -->
    <div id="pantalla-animacion">
        <div class="calle">
            <div class="lineas-calle"></div>
        </div>
        
        <!-- Dibujo del Stickman en Bici con Guitarra (SVG) -->
        <div class="contenedor-stickman">
            <svg width="250" height="250" viewBox="0 0 200 200">
                <!-- Ruedas -->
                <g class="rueda" style="transform-origin: 50px 160px;">
                    <circle cx="50" cy="160" r="30" stroke="black" stroke-width="4" fill="none" />
                    <line x1="50" y1="130" x2="50" y2="190" stroke="black" stroke-width="2" />
                    <line x1="20" y1="160" x2="80" y2="160" stroke="black" stroke-width="2" />
                </g>
                <g class="rueda" style="transform-origin: 150px 160px;">
                    <circle cx="150" cy="160" r="30" stroke="black" stroke-width="4" fill="none" />
                    <line x1="150" y1="130" x2="150" y2="190" stroke="black" stroke-width="2" />
                    <line x1="120" y1="160" x2="180" y2="160" stroke="black" stroke-width="2" />
                </g>
                
                <!-- Marco de la bici -->
                <line x1="50" y1="160" x2="90" y2="110" stroke="black" stroke-width="4" />
                <line x1="90" y1="110" x2="140" y2="110" stroke="black" stroke-width="4" />
                <line x1="140" y1="110" x2="150" y2="160" stroke="black" stroke-width="4" />
                <line x1="50" y1="160" x2="120" y2="160" stroke="black" stroke-width="4" />
                <line x1="120" y1="160" x2="90" y2="110" stroke="black" stroke-width="4" />
                <!-- Manubrio y asiento -->
                <line x1="140" y1="110" x2="135" y2="90" stroke="black" stroke-width="4" />
                <line x1="125" y1="90" x2="145" y2="90" stroke="black" stroke-width="4" />
                <line x1="90" y1="110" x2="85" y2="95" stroke="black" stroke-width="4" />
                <line x1="75" y1="95" x2="95" y2="95" stroke="black" stroke-width="4" />

                <!-- Stickman -->
                <!-- Cabeza -->
                <circle cx="95" cy="45" r="15" stroke="black" stroke-width="4" fill="white" />
                <!-- Cuerpo -->
                <line x1="95" y1="60" x2="85" y2="105" stroke="black" stroke-width="4" />
                <!-- Piernas -->
                <line x1="85" y1="105" x2="110" y2="135" stroke="black" stroke-width="4" />
                <line x1="110" y1="135" x2="120" y2="160" stroke="black" stroke-width="4" />

                <!-- Guitarra -->
                <!-- Cuerpo de la guitarra -->
                <path d="M 60 85 C 50 70, 80 50, 90 70 C 100 90, 70 100, 60 85 Z" fill="#8B4513" stroke="black" stroke-width="2" />
                <!-- Mástil -->
                <line x1="85" y1="75" x2="130" y2="55" stroke="black" stroke-width="4" />
                
                <!-- Brazos tocando -->
                <line x1="93" y1="68" x2="70" y2="80" stroke="black" stroke-width="4" />
                <line x1="93" y1="68" x2="115" y2="65" stroke="black" stroke-width="4" />
            </svg>
        </div>
    </div>

    <audio id="musica-fondo" src="ssstik.io_1790734051120.mp3" loop></audio>

    <script>
        const btnIniciar = document.getElementById('btn-iniciar');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const pantallaAnimacion = document.getElementById('pantalla-animacion');
        const audioFondo = document.getElementById('musica-fondo');

        btnIniciar.addEventListener('click', () => {
            pantallaInicio.style.display = 'none';
            pantallaAnimacion.style.display = 'block';
            
            // Intenta reproducir el audio
            audioFondo.play().catch(error => {
                alert("¡No se encontró la música! Asegúrate de tener el archivo llamado 'audio.mp3' guardado en la misma carpeta que este archivo HTML.");
                console.error("Error de audio:", error);
            });
        });
    </script>
</body>
</html>
